$kind: http-request
url: "{{baseUrl}}/portfolios/me/skills"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "category": "CLOUD_DEVOPS",
      "name": "Kubernetes"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Saved skillId to environment", function () {
          var json = pm.response.json();
          if (json.id) {
              pm.environment.set("skillId", json.id);
          }
      });
    language: text/javascript
order: 2000
