$kind: http-request
url: "{{baseUrl}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var json = pm.response.json();
          if (json.accessToken) {
              pm.environment.set('accessToken', json.accessToken);
          }
      }
    language: text/javascript
order: 3000
