$kind: http-request
url: "{{baseUrl}}/portfolios/me/educations/{{educationId}}"
method: DELETE
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 204 No Content", function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 5000
