$kind: http-request
url: "{{baseUrl}}/portfolios/me/educations"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "institution": "Ho Chi Minh City Open University",
      "degree": "Bachelor of Science",
      "fieldOfStudy": "Computer Science",
      "periodText": "2022 — 2026",
      "highlights": "GPA 3.6/4.0. Top 5% academic achievement."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Saved educationId to environment", function () {
          var json = pm.response.json();
          if (json.id) {
              pm.environment.set("educationId", json.id);
          }
      });
    language: text/javascript
order: 2000
