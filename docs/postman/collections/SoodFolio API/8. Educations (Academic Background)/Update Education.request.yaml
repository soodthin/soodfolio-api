$kind: http-request
url: "{{baseUrl}}/portfolios/me/educations/{{educationId}}"
method: PUT
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "institution": "Ho Chi Minh City Open University",
      "degree": "Bachelor of Science (Honors)",
      "fieldOfStudy": "Software Engineering & Cloud Computing",
      "periodText": "2022 — 2026",
      "highlights": "Graduated with High Distinction. GPA 3.75/4.0."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Degree updated properly", function () {
          var json = pm.response.json();
          pm.expect(json.degree).to.include("Honors");
      });
    language: text/javascript
order: 3000
