$kind: http-request
url: "{{baseUrl}}/i18n/locale"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Current locale is returned", function () {
          var json = pm.response.json();
          pm.expect(json.currentLocale).to.exist;
          pm.expect(json.supportedLocales).to.include("en");
          pm.expect(json.supportedLocales).to.include("vi");
      });
    language: text/javascript
order: 1000
