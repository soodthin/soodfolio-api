$kind: http-request
url: "{{baseUrl}}/i18n/translations?lang=vi"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Vietnamese dictionary loaded", function () {
          var json = pm.response.json();
          pm.expect(json.locale).to.equal("vi");
          pm.expect(json.translations["common.success"]).to.equal("Thành công");
      });
    language: text/javascript
order: 3000
