$kind: http-request
url: "{{baseUrl}}/i18n/translations?lang=en"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("English dictionary loaded", function () {
          var json = pm.response.json();
          pm.expect(json.locale).to.equal("en");
          pm.expect(json.translations["common.success"]).to.equal("Success");
      });
    language: text/javascript
order: 2000
