$kind: http-request
url: "{{baseUrl}}/uploads?type=image"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  formdata:
    - name: file
      type: file
      value: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Response contains uploaded url", function () {
          var json = pm.response.json();
          pm.expect(json.url).to.exist;
      });
    language: text/javascript
order: 3000
