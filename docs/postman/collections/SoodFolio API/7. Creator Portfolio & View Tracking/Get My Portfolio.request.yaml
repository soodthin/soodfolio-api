$kind: http-request
url: "{{baseUrl}}/portfolios/me"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Portfolio has username and totalViews", function () {
          var json = pm.response.json();
          pm.expect(json.username).to.be.a("string");
          pm.expect(json.totalViews).to.be.a("number");
      });
    language: text/javascript
order: 1000
