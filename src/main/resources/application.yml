server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: soodfolio-api
  datasource:
    url: jdbc:postgresql://localhost:5432/soodfolio_db
    username: postgres
    password: Admin123
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 25
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

# JWT & OAuth2 Configuration
app:
