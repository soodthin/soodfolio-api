server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: soodfolio-api
  datasource:
    url: jdbc:postgresql://localhost:5432/soodfolio_db
    username: postgres
    password: Admin123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
