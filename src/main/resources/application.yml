server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    context-path: /api/v1

spring:
  application:
    name: soodfolio-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:soodfolio_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${FLYWAY_DB_URL:${spring.datasource.url}}
    user: ${FLYWAY_DB_USERNAME:${spring.datasource.username}}
    password: ${FLYWAY_DB_PASSWORD:${spring.datasource.password}}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 25
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

# Actuator Healthcheck
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# JWT, Storage, Mail, CORS & OAuth2 Configuration
app:
  storage:
    provider: ${STORAGE_PROVIDER:local} # local | cloudinary
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      base-url: ${CLOUDINARY_BASE_URL:https://api.cloudinary.com}
      folder-prefix: ${CLOUDINARY_FOLDER_PREFIX:soodfolio}
      url: ${CLOUDINARY_URL:}
  upload:
    dir: uploads
  mail:
    provider: ${MAIL_PROVIDER:noop} # noop | brevo
    brevo:
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_BASE_URL:https://api.brevo.com}
    sender-email: ${MAIL_SENDER_EMAIL:}
    sender-name: ${MAIL_SENDER_NAME:SoodFolio}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  cookie:
    secure: ${COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
  oauth2:
    sandbox-enabled: ${OAUTH_SANDBOX_ENABLED:false}
    allowed-redirect-uris: ${OAUTH_ALLOWED_REDIRECT_URIS:http://localhost:3000/auth/callback/github,http://localhost:3000/auth/callback/google,http://localhost:3001/auth/callback/github,http://localhost:3001/auth/callback/google}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  auth:
    log-reset-link: ${AUTH_LOG_RESET_LINK:false}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  rate-limit:
    public-enabled: ${APP_RATE_LIMIT_PUBLIC_ENABLED:true}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:8}
    rate-limit-per-minute: ${GEMINI_RATE_LIMIT_PER_MIN:15}

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
